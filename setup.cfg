[metadata]
name = co2rr-network
version = 0.2.0
description = Reaction network construction, analysis and bottleneck path search
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Chemistry

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
co2rr_network = resources/*.json
    _vendor/fairchem/**/*.md
    _vendor/fairchem/**/*.json
    _vendor/fairchem/**/*.yml
    _vendor/fairchem/**/*.yaml
    _vendor/fairchem/**/*.pt
    _vendor/fairchem/**/LICENSE
    _vendor/fairchem/LICENSE
    _vendor/README.md

[options.extras_require]
plots =
    matplotlib>=3.7; python_version >= "3.8"
kinetics =
    numpy>=1.24; python_version >= "3.8"
    scipy>=1.10; python_version >= "3.8"

[options.entry_points]
console_scripts =
    co2rr = co2rr_network.cli:main
